      } catch {
        return null;
      }
    };

    const getDiagnosticEndpointPath = (value) => {
      try {
        return new URL(value).pathname || '/';
      } catch {
        return value ? '自定义接口' : '未记录';
      }
    };

    const getDiagnosticImageHost = (value) => {
      try {
        return new URL(value).host || 'API 响应';
      } catch {
        return 'API 响应';
      }
    };

    const getDiagnosticFailureReason = (error, phase = 'request') => {
      const message = String(error?.message || '').toLowerCase();
      if (phase === 'restore') return 'IndexedDB 图片记录读取失败';
      if (/未返回 url|未返回可识别|未返回图片/.test(message)) return 'API 未返回可识别的图片数据';
      if (/fetch|network|cors|图片下载|failed to fetch/.test(message)) return '图片 URL 无法读取（CORS、网络或链接失效）';
      if (phase === 'storage') return 'IndexedDB 图片写入失败';
      return '生图请求失败';
    };

    // 上游一旦受理生图就会计费，本地放弃不会退款。
    // 这份日志按“是否可能已计费”标注每一次请求，用来和中转站账单逐条对账。
    const loadImageUsageLog = () => {
      try {
        const value = JSON.parse(localStorage.getItem(MOREIMG_IMAGE_USAGE_LOG_KEY) || '[]');
        return Array.isArray(value) ? value.filter(item => item && typeof item === 'object') : [];
      } catch {
        return [];
      }
    };

    const appendImageUsageLog = (entry) => {
      const nextLog = [{ ...entry, at: new Date().toISOString() }, ...loadImageUsageLog()].slice(0, IMAGE_USAGE_LOG_LIMIT);
      try {
        localStorage.setItem(MOREIMG_IMAGE_USAGE_LOG_KEY, JSON.stringify(nextLog));
      } catch {}
      return nextLog;
    };

    const clearImageUsageLog = () => {
      try {
        localStorage.removeItem(MOREIMG_IMAGE_USAGE_LOG_KEY);
      } catch {}
      return [];
    };

    const formatImageUsageLogText = (log = []) => {
      const header = '时间\t模型\t尺寸\t页面/模式\t耗时(秒)\t结果\t可能已计费\t说明';
      const rows = log.map(item => [
        item.at ? new Date(item.at).toLocaleString() : '',
        item.model || '',
        item.size || '',
        `${item.cardTitle || ''}/${item.mode || ''}`,
        typeof item.durationMs === 'number' ? (item.durationMs / 1000).toFixed(1) : '',
        item.outcome || '',
        item.mayBeBilled ? '是' : '否',
        String(item.detail || '').replace(/\s+/g, ' ')
      ].join('\t'));
      return [header, ...rows].join('\n');
    };

    const summarizeImageUsageLog = (log = []) => {
      const billedFailures = log.filter(item => item.outcome !== '成功' && item.mayBeBilled);
      return {
        total: log.length,
        success: log.filter(item => item.outcome === '成功').length,
        billedFailures: billedFailures.length
      };
    };

    const openImageDatabase = () => new Promise((resolve, reject) => {
      const request = indexedDB.open(IMAGE_DB_NAME, 2);
      request.onupgradeneeded = () => {
        const database = request.result;
        if (!database.objectStoreNames.contains(IMAGE_STORE_NAME)) {
          const store = database.createObjectStore(IMAGE_STORE_NAME, { keyPath: 'id' });
          store.createIndex('sessionId', 'sessionId', { unique: false });
        }
        if (!database.objectStoreNames.contains(SESSION_STORE_NAME)) {
          database.createObjectStore(SESSION_STORE_NAME, { keyPath: 'id' });
        }
      };
      request.onsuccess = () => resolve(request.result);
      request.onerror = () => reject(request.error);
    });

    const saveImageBlob = async (sessionId, cardTitle, blob, mode = 'visual', focusY) => {
      const database = await openImageDatabase();
      await new Promise((resolve, reject) => {
        const transaction = database.transaction(IMAGE_STORE_NAME, 'readwrite');
        transaction.objectStore(IMAGE_STORE_NAME).put({ id: `${sessionId}:${mode}:${cardTitle}`, sessionId, cardTitle, mode, blob, focusY, updatedAt: Date.now() });
        transaction.oncomplete = resolve;
        transaction.onerror = () => reject(transaction.error);
      });
      database.close();
    };

    const saveImageFocus = async (sessionId, cardTitle, mode, focusY) => {
      const database = await openImageDatabase();
      await new Promise((resolve, reject) => {
        const transaction = database.transaction(IMAGE_STORE_NAME, 'readwrite');
        const store = transaction.objectStore(IMAGE_STORE_NAME);
        const request = store.get(`${sessionId}:${mode}:${cardTitle}`);
        request.onsuccess = () => {
          if (request.result) store.put({ ...request.result, focusY, updatedAt: Date.now() });
        };
        request.onerror = () => reject(request.error);
        transaction.oncomplete = resolve;
        transaction.onerror = () => reject(transaction.error);
      });
      database.close();
    };

      if (!sessionId) return [];
      const database = await openImageDatabase();
      const images = await new Promise((resolve, reject) => {
        const transaction = database.transaction(IMAGE_STORE_NAME, 'readonly');
        const request = transaction.objectStore(IMAGE_STORE_NAME).index('sessionId').getAll(sessionId);
        request.onsuccess = () => resolve(request.result || []);
        request.onerror = () => reject(request.error);
      });
      database.close();
      return images;
    };

    const deleteSessionImages = async (sessionId) => {

        const transaction = database.transaction(IMAGE_STORE_NAME, 'readonly');
        const request = transaction.objectStore(IMAGE_STORE_NAME).index('sessionId').getAll(sessionId);
        request.onsuccess = () => resolve(request.result || []);
        request.onerror = () => reject(request.error);
      });
      await new Promise((resolve, reject) => {
        const transaction = database.transaction(IMAGE_STORE_NAME, 'readwrite');
        const store = transaction.objectStore(IMAGE_STORE_NAME);
        images.forEach(item => store.delete(item.id));
        transaction.oncomplete = resolve;
        transaction.onerror = () => reject(transaction.error);
      });
      database.close();

      const records = await new Promise((resolve, reject) => {
        const transaction = database.transaction(SESSION_STORE_NAME, 'readonly');
        const store = transaction.objectStore(SESSION_STORE_NAME);
        const results = [];
        let completed = 0;
        entries.forEach((entry, index) => {
          const request = store.get(entry.id);
          request.onsuccess = () => {
            results[index] = request.result || null;
            completed += 1;
            if (completed === entries.length) resolve(results);
          };
          request.onerror = () => reject(request.error);
        });
        transaction.onerror = () => reject(transaction.error);
      });
      database.close();
      return entries.filter((_, index) => records[index]);
    };

        const items = [];
        const bracketRegex = /\[((?:封面|正文\d+\/\d+|封底))\]\s*([\s\S]*?)(?=\[(?:封面|正文\d+\/\d+|封底)\]|$)/g;
        while ((match = bracketRegex.exec(value)) !== null) {
          items.push({ title: match[1].trim(), text: match[2].trim() });
        }
        return items;
      };
      const codeBlockSources = [...source.matchAll(/```[^\n]*\n([\s\S]*?)```/g)].map(block => block[1]);
      const bracketCandidates = [...codeBlockSources.map(parseBracketSections), parseBracketSections(source)];

      const plainHeaderRegex = /(?:^|\n)\s*(?:#{1,6}\s*)?(封面|正文\d+\/\d+|封底)(?:提示词)?\s*[：:]?\s*(?=\n|$)/g;
      const headers = [...source.matchAll(plainHeaderRegex)];
      const plainSections = headers.map((header, index) => {
        const blockStart = header.index + header[0].length;
        const blockEnd = headers[index + 1]?.index ?? source.length;
        return { title: header[1].trim(), text: source.slice(blockStart, blockEnd).trim() };
      });

      const dedupeSections = (items) => {
        const seen = new Set();
        return items.filter(section => {
          if (!section.title || !section.text || seen.has(section.title)) return false;
          seen.add(section.title);
          return true;
        });
      };

      return [headingSections, ...bracketCandidates, plainSections]
        .map(dedupeSections)
        .sort((left, right) => right.length - left.length)[0] || [];
    };

    const assessAnalysisDepth = (parsed, originalText = '') => {
      const inputLength = String(originalText || '').replace(/\s+/g, '').length;
      if (!inputLength) return { isAdequate: true, requiredStage3Length: 0 };
      const stageLengths = [1, 2, 3].map(stage => String(parsed.stages[stage] || '').replace(/\s+/g, '').length);
      const isCompactSource = inputLength < 600;
      const requiredStage3Length = isCompactSource
        ? Math.max(60, Math.floor(inputLength * 0.45))
        : Math.min(1200, Math.max(360, Math.floor(inputLength * 0.5)));
      const requiredStage1Length = isCompactSource ? 40 : 60;
      const requiredStage2Length = isCompactSource ? 60 : 180;
      return {
        isAdequate: stageLengths[0] >= requiredStage1Length && stageLengths[1] >= requiredStage2Length && stageLengths[2] >= requiredStage3Length,
        requiredStage3Length,
        stageLengths
      };
    };

    const assessProcessingResult = (fullText, originalText = '') => {
      const text = String(fullText || '').trim();
      const parsed = parseStreamedText(text);
      const isRejected = parsed.latestStage === 1 && /(不适合|不通过|不足以|建议提供|暂不适合)/.test(parsed.stages[1] || '');
      const hasStage4 = Boolean(parsed.stages[4]?.trim());
      const hasStage5 = Boolean(parsed.stages[5]?.trim());
      const parsedCards = parseCardPackage(parsed.stages[4]);
      const parsedPrompts = parsePromptSections(parsed.stages[5]);
      const cardTypes = new Set(parsedCards.map(card => card.type));
      const cardPageKeys = parsedCards.map(card => card.imageKey);
      const promptHeadingKeys = [...String(parsed.stages[5] || '').matchAll(/(?:^|\n)\s*#{1,6}\s*\[?((?:封面|正文\d+\/\d+|封底))\]?\s*(?=\n|$)/g)]
        .map(match => match[1]);
      const promptPageKeys = promptHeadingKeys.length > 0
        ? promptHeadingKeys
        : parsedPrompts.map(section => section.title);
      const promptTitles = new Set(promptPageKeys);
      const hasUsableCards = cardTypes.has('cover') && cardTypes.has('body') && cardTypes.has('back');
      const hasUsablePrompts = promptTitles.has('封面') && [...promptTitles].some(title => /^正文\d+\/\d+$/.test(title)) && promptTitles.has('封底');
      const isValidPageSequence = (pageKeys) => {
        if (pageKeys.length < 3 || pageKeys[0] !== '封面' || pageKeys.at(-1) !== '封底') return false;
        if (new Set(pageKeys).size !== pageKeys.length) return false;
        const bodyKeys = pageKeys.slice(1, -1);
        return bodyKeys.length > 0 && bodyKeys.every((pageKey, index) => {
          const match = pageKey.match(/^正文(\d+)\/(\d+)$/);
          return Boolean(match) && Number(match[1]) === index + 1 && Number(match[2]) === bodyKeys.length;
        });
      };
      const hasExactPageMapping = isValidPageSequence(cardPageKeys)
        && isValidPageSequence(promptPageKeys)
        && cardPageKeys.length === promptPageKeys.length
        && cardPageKeys.every((pageKey, index) => pageKey === promptPageKeys[index]);
      const hasFormatError = text.includes('接口返回格式异常');
      const analysisDepth = assessAnalysisDepth(parsed, originalText);
      const isComplete = hasUsableCards && hasUsablePrompts && hasExactPageMapping && analysisDepth.isAdequate && !hasFormatError;
      const canContinue = hasStage4 && hasStage5 && hasUsableCards && hasUsablePrompts && hasExactPageMapping && !hasFormatError;
      const warning = canContinue && !analysisDepth.isAdequate
        ? '阶段1至3内容仍过于简略，已保留卡片和提示词，建议换用指令遵循能力更强的文本模型重试。'
        : canContinue && !isComplete ? '内容已生成，但部分卡片或提示词格式不标准，请在生图前检查。' : '';
      return {
        parsed,
        analysisDepth,
        isComplete,
        canContinue,
        warning,
        isRejected,
        reason: hasFormatError ? '接口返回格式异常' : !hasStage4 ? '尚未生成阶段4卡片内容' : !hasStage5 ? '尚未生成阶段5提示词内容' : !hasUsableCards ? '阶段4卡片格式不完整' : !hasUsablePrompts ? '阶段5提示词格式不完整' : !hasExactPageMapping ? '卡片与提示词未一一对应' : !analysisDepth.isAdequate ? '阶段1至3内容过于简略' : ''
      };
    };

    const applyProcessingFinishReason = (assessment, finishReason = '') => {
      const normalizedFinishReason = String(finishReason || '').trim().toLowerCase();
      const isTruncated = ['length', 'max_tokens', 'max_output_tokens'].includes(normalizedFinishReason);
      if (!isTruncated || assessment.isRejected) return { ...assessment, finishReason: normalizedFinishReason };
      return {
        ...assessment,
        isComplete: false,
        canContinue: false,
        warning: '',
        reason: `输出达到 ${PROCESSING_MAX_OUTPUT_TOKENS} Token 上限`,
        finishReason: normalizedFinishReason
      };
    };

    const formatProcessingError = (error) => {
      const message = String(error?.message || error || '未知错误').trim();
      if (/\bHTTP 524\b/.test(message)) {
        return '上游模型服务响应超时（HTTP 524），请稍后重试或换用响应更快的文本模型。';
      }
      return `引擎连接失败：${message}`;
    };

    const MOREIMG_SCHEMA_VERSION = 'moreimg-1.0';
    const MOREIMG_PAGE_TYPES = new Set(['cover', 'process', 'timeline', 'relationship', 'comparison', 'checklist', 'framework', 'quote']);
    const MOREIMG_MODES = new Set(['standard', 'short', 'single_point']);
    const MOREIMG_MEDIA = new Set(['3d_model', 'geometric_silhouette', 'hand_drawn_line', 'isometric_icon', 'flat_vector', 'wireframe_perspective']);
    const MOREIMG_SURFACES = new Set(['light', 'dark']);
    const MOREIMG_OVERLAYS = new Set(['none', 'soft_dark', 'soft_light']);

    const createDefaultProcessingPreferences = () => ({
      refinement: 'standard',
      pageCount: 'auto',
      preserveTitle: true,
      tone: 'preserve',
      customInstruction: ''
    });

    const requireObject = (value, path, errors) => {
      if (!value || typeof value !== 'object' || Array.isArray(value)) {
        errors.push(`${path} 必须是对象`);
        return false;
      }
      return true;
    };

    const requireString = (value, path, errors, options = {}) => {
      const { allowEmpty = false, maxLength = 0 } = options;
      if (typeof value !== 'string' || (!allowEmpty && !value.trim())) {
        errors.push(`${path} 必须是${allowEmpty ? '' : '非空'}字符串`);
        return false;
      }
      if (maxLength && value.length > maxLength) errors.push(`${path} 不能超过 ${maxLength} 个字符`);
      return true;
    };

    const requireStringArray = (value, path, errors, options = {}) => {
      const { min = 0, max = Infinity, itemMaxLength = 0 } = options;
      if (!Array.isArray(value)) {
        errors.push(`${path} 必须是数组`);
        return false;
      }
      if (value.length < min || value.length > max) errors.push(`${path} 数量必须为 ${min}-${max} 项`);
      value.forEach((item, index) => requireString(item, `${path}[${index}]`, errors, { maxLength: itemMaxLength }));
      return true;
    };

    const validateMoreImgPackage = (packageData, originalText = '') => {
      const errors = [];
      const warnings = [];
      if (!requireObject(packageData, '根对象', errors)) return { packageData, isComplete: false, canContinue: false, isRejected: false, reason: errors[0], warning: '', errors, warnings };
      if (packageData.schema_version !== MOREIMG_SCHEMA_VERSION) errors.push(`schema_version 必须是 ${MOREIMG_SCHEMA_VERSION}`);
      if (!['complete', 'rejected'].includes(packageData.status)) errors.push('status 必须是 complete 或 rejected');

      if (packageData.status === 'rejected') {
        requireString(packageData.reason, 'reason', errors);
        return {
          packageData,
          isComplete: false,
          canContinue: false,
          isRejected: errors.length === 0,
          reason: errors[0] || packageData.reason,
          warning: '',
          errors,
          warnings
        };
      }

      if (requireObject(packageData.analysis, 'analysis', errors)) {
        if (!MOREIMG_MODES.has(packageData.analysis.mode)) errors.push('analysis.mode 必须是 standard、short 或 single_point');
        requireString(packageData.analysis.topic, 'analysis.topic', errors);
        requireString(packageData.analysis.core_claim, 'analysis.core_claim', errors);
        requireStringArray(packageData.analysis.independent_units, 'analysis.independent_units', errors, { min: 1 });
        if (!Array.isArray(packageData.analysis.fact_notes)) errors.push('analysis.fact_notes 必须是数组');
        if (!Array.isArray(packageData.analysis.logic_issues)) errors.push('analysis.logic_issues 必须是数组');
      }

      if (requireObject(packageData.article, 'article', errors)) {
        requireString(packageData.article.title, 'article.title', errors);
        requireString(packageData.article.subtitle, 'article.subtitle', errors, { allowEmpty: true });
        if (requireStringArray(packageData.article.paragraphs, 'article.paragraphs', errors, { min: 1 })) {
          const sourceLength = String(originalText || '').replace(/\s+/g, '').length;
          const articleLength = packageData.article.paragraphs.join('').replace(/\s+/g, '').length;
          if (packageData.analysis?.mode === 'standard' && sourceLength >= 600) {
            const retentionRatio = articleLength / sourceLength;
            if (retentionRatio < 0.3) {
              errors.push('article.paragraphs 过短，标准模式正文保留率低于 30%');
            } else if (retentionRatio < 0.65) {
              warnings.push('标准模式正文保留率低于 65%，可能已去重或压缩，请核对完整性');
            }
          }
        }
      }

      if (requireObject(packageData.style_lock, 'style_lock', errors)) {
        const styleLock = packageData.style_lock;
        requireString(styleLock.style_id, 'style_lock.style_id', errors);
        requireString(styleLock.style_name, 'style_lock.style_name', errors);
        requireString(styleLock.prompt_prefix, 'style_lock.prompt_prefix', errors);
        requireStringArray(styleLock.negative, 'style_lock.negative', errors, { min: 1 });
        if (requireObject(styleLock.card_shell, 'style_lock.card_shell', errors)) {
          if (styleLock.card_shell.preset !== 'moreimg-clean-v1') errors.push('style_lock.card_shell.preset 必须是 moreimg-clean-v1');
          if (!MOREIMG_SURFACES.has(styleLock.card_shell.surface)) errors.push('style_lock.card_shell.surface 必须是 light 或 dark');
          if (!/^#[0-9A-F]{6}$/i.test(styleLock.card_shell.accent_color || '')) errors.push('style_lock.card_shell.accent_color 必须是 #RRGGBB 色值');
          if (!MOREIMG_OVERLAYS.has(styleLock.card_shell.overlay)) errors.push('style_lock.card_shell.overlay 不受支持');
        }
        if (requireObject(styleLock.visual_dna, 'style_lock.visual_dna', errors)) {
          const dna = styleLock.visual_dna;
          if (!MOREIMG_MEDIA.has(dna.medium)) errors.push('style_lock.visual_dna.medium 不受支持');
          ['visual_world', 'shape_language', 'perspective', 'lighting', 'material', 'recurring_subject'].forEach(field => requireString(dna[field], `style_lock.visual_dna.${field}`, errors));
          requireStringArray(dna.recurring_elements, 'style_lock.visual_dna.recurring_elements', errors, { min: 1 });
        }
      }

      if (!Array.isArray(packageData.pages)) {
        errors.push('pages 必须是数组');
      } else {
        if (packageData.pages.length < 3 || packageData.pages.length > 9) errors.push('pages 必须包含封面、1-7张正文和封底');
        const pageIds = new Set();
        packageData.pages.forEach((page, index) => {
          const path = `pages[${index}]`;
          if (!requireObject(page, path, errors)) return;
          requireString(page.page_id, `${path}.page_id`, errors);
          if (pageIds.has(page.page_id)) errors.push(`${path}.page_id 重复`);
          pageIds.add(page.page_id);
          if (page.order !== index + 1) errors.push(`${path}.order 必须是 ${index + 1}`);
          if (!MOREIMG_PAGE_TYPES.has(page.page_type)) errors.push(`${path}.page_type 不受支持`);
          if (index === 0 && (page.page_id !== 'cover' || page.page_type !== 'cover')) errors.push('第1页必须是 cover 封面');
          if (index > 0 && index < packageData.pages.length - 1 && page.page_id !== `content-${String(index).padStart(2, '0')}`) errors.push(`${path}.page_id 必须连续编号`);

          if (requireObject(page.card, `${path}.card`, errors)) {
            requireString(page.card.title, `${path}.card.title`, errors);
            requireString(page.card.subtitle, `${path}.card.subtitle`, errors, { allowEmpty: true });
            requireStringArray(page.card.points, `${path}.card.points`, errors, { max: 5, itemMaxLength: 25 });
            requireString(page.card.summary, `${path}.card.summary`, errors, { allowEmpty: true, maxLength: 20 });
          }
          if (requireObject(page.semantic, `${path}.semantic`, errors)) {
            ['page_goal', 'primary_claim', 'primary_concept', 'primary_relation'].forEach(field => requireString(page.semantic[field], `${path}.semantic.${field}`, errors));
            ['supporting_concepts', 'excluded_concepts', 'avoid_misread'].forEach(field => requireStringArray(page.semantic[field], `${path}.semantic.${field}`, errors));
          }
          if (requireObject(page.image_prompt, `${path}.image_prompt`, errors)) {
            ['scene', 'relationship', 'composition', 'continuity'].forEach(field => requireString(page.image_prompt[field], `${path}.image_prompt.${field}`, errors));
            const expectedSafeArea = index === 0 ? 'top_40' : index === packageData.pages.length - 1 ? 'top_36' : 'top_52';
            if (page.image_prompt.safe_area !== expectedSafeArea) errors.push(`${path}.image_prompt.safe_area 必须是 ${expectedSafeArea}`);
            requireStringArray(page.image_prompt.avoid, `${path}.image_prompt.avoid`, errors);
          }
        });
        const closing = packageData.pages.at(-1);
        if (!closing || closing.page_id !== 'closing' || closing.page_type !== 'quote') errors.push('最后一页必须是 closing 封底');
      }

      return {
        packageData,
        isComplete: errors.length === 0 && warnings.length === 0,
        canContinue: errors.length === 0,
        isRejected: false,
        reason: errors[0] || '',
        warning: warnings[0] || '',
        errors,
        warnings
      };
    };

    const parseMoreImgPackage = (rawText, originalText = '') => {
      const source = String(rawText || '').trim();
      if (!source || source.startsWith('```') || source.endsWith('```')) throw new Error('接口必须返回合法 JSON，不能包含 Markdown 代码块或解释文字');
      let packageData;
      try {
        packageData = JSON.parse(source);
      } catch (error) {
        throw new Error(`接口未返回合法 JSON：${error.message}`);
      }
      return validateMoreImgPackage(packageData, originalText);
    };

    const buildPageImagePrompt = (styleLock, page) => {
      if (!styleLock || !page?.image_prompt) return '';
      const localAvoid = Array.isArray(page.image_prompt.avoid) ? page.image_prompt.avoid : [];
      const globalAvoid = Array.isArray(styleLock.negative) ? styleLock.negative : [];
      const safeAreaLabels = {
        top_36: '顶部约36%作为文字承载范围',
        top_40: '顶部约40%作为文字承载范围',
        top_52: '顶部约52%作为文字承载范围'
      };
      const safeArea = safeAreaLabels[page.image_prompt.safe_area] || safeAreaLabels.top_52;
      const compositionBridge = page.page_id === 'closing'
        ? '收束主体、路径或结构走势必须进入画面中部，与上方结论自然衔接'
        : page.page_id === 'cover'
          ? '主场景轮廓从画面中部开始清晰出现，与标题区域形成连续叙事'
          : '弱化后的环境结构延伸到文字区，主关系在画面中部开始建立';
      return `无文字主视觉，3:4全幅连续背景。画面气质：${styleLock.prompt_prefix}。场景：${page.image_prompt.scene}。主关系：${page.image_prompt.relationship}。构图：${page.image_prompt.composition}；${safeArea}，只降低细节和对比，背景、光影与环境结构仍须连续，不能成为纯色留白或空雾占位；${compositionBridge}。系列连续性：${page.image_prompt.continuity}。避免：${[...globalAvoid, ...localAvoid].filter(Boolean).join('、')}。不得出现任何文字、字母、数字、符号、Logo、水印、UI标签、卡片框架或伪文字纹理。`;
    };

    const PROCESSING_PREFERENCE_LABELS = {
      refinement: { standard: '标准精修', light: '轻度整理' },
      tone: { preserve: '尽量保留原文语气', concise: '更简洁克制', conversational: '更口语自然' }
    };

    const buildInitialProcessingMessages = (originalText, systemPrompt = '', preferences = createDefaultProcessingPreferences()) => {
      const pageCountText = preferences.pageCount === 'auto' ? '自动决定，固定包含封面和封底' : `总页数：${preferences.pageCount}页，固定包含封面和封底`;
      const preferenceLines = [
        `精修方式：${PROCESSING_PREFERENCE_LABELS.refinement[preferences.refinement] || PROCESSING_PREFERENCE_LABELS.refinement.standard}`,
        `卡片页数：${pageCountText}`,
        `原文标题：${preferences.preserveTitle ? '必须优先保留，除非原文没有可用标题' : '允许优化但不得改变核心命名'}`,
        `内容口吻：${PROCESSING_PREFERENCE_LABELS.tone[preferences.tone] || PROCESSING_PREFERENCE_LABELS.tone.preserve}`,
        preferences.customInstruction?.trim() ? `补充要求：${preferences.customInstruction.trim()}` : ''
      ].filter(Boolean);
      return [
        { role: 'system', content: systemPrompt },
        { role: 'user', content: `请按内置规则处理以下原文，并只返回 moreimg-1.0 JSON。\n\n加工偏好：\n${preferenceLines.join('\n')}\n\n原文：\n${originalText}` }
      ];
    };

    const IMAGE_SIZE_PATTERN = /^\d{3,5}x\d{3,5}$/;
    // gpt-image 系列只接受这几个枚举值。填 768x1024 这类非法值时，宽松的中转站会按自己的
    // 默认尺寸出图并照常计费，用户以为参数生效、实际拿到的是另一个规格。
    const GPT_IMAGE_SIZES = ['1024x1024', '1024x1536', '1536x1024', 'auto'];
    const DEFAULT_IMAGE_SIZE = '1024x1536';

    const isGptImageModel = (model = '') => /^gpt-image/i.test(String(model || '').trim());

    const normalizeImageSize = (size, model = '') => {
      const value = String(size || '').trim().toLowerCase();
      if (isGptImageModel(model)) {
        return GPT_IMAGE_SIZES.includes(value) ? value : DEFAULT_IMAGE_SIZE;
      }
      return IMAGE_SIZE_PATTERN.test(value) ? value : DEFAULT_IMAGE_SIZE;
    };

    const getImageSizeWarning = (size, model = '') => {
      const value = String(size || '').trim().toLowerCase();
      if (!value) return '';
      if (isGptImageModel(model) && !GPT_IMAGE_SIZES.includes(value)) {
        return `${model} 只支持 ${GPT_IMAGE_SIZES.join(' / ')}，将按 ${DEFAULT_IMAGE_SIZE} 请求。填写非法尺寸时中转站可能按自己的默认规格出图并照常计费。`;
      }
      if (!isGptImageModel(model) && !IMAGE_SIZE_PATTERN.test(value)) {
        return `尺寸格式应为“宽x高”，例如 ${DEFAULT_IMAGE_SIZE}，将按 ${DEFAULT_IMAGE_SIZE} 请求。`;
      }
      return '';
    };

    // 走 URL 时图片要再从第三方 CDN 下载一次，而那些 CDN 多半不带 CORS 头、
    // 链接也常在几分钟内失效，于是“已生成且已计费”的图会因为下载失败被判成整次失败。
    // 所以尽量要求 base64：gpt-image 系列本来就只返回 b64_json，且会把
    // response_format 当成未知参数直接 400，只能对其他模型显式声明。
    const buildImageRequestBody = (model, prompt, size) => ({
      model,
      prompt,
      size: normalizeImageSize(size, model),
      n: 1,
      ...(isGptImageModel(model) ? {} : { response_format: 'b64_json' })
    });

    // 中转站在 5xx / 网关超时时返回的是 HTML 错误页，裸 response.json() 会抛
    // "Unexpected token '<'"，把真实状态码和上游提示全部吞掉。
    const readImageResponse = async (response) => {
      const rawText = await response.text();
      let data = null;
      try {
        data = JSON.parse(rawText);
      } catch {}
      if (!response.ok) {
        const upstreamMessage = data?.error?.message || data?.message || '';
        const preview = upstreamMessage || rawText.replace(/\s+/g, ' ').trim().slice(0, 200);
        throw new Error(`HTTP ${response.status}${preview ? `：${preview}` : ''}`);
      }
      if (!data) {
        throw new Error(`接口返回了非 JSON 内容：${rawText.replace(/\s+/g, ' ').trim().slice(0, 200) || '空响应'}`);
      }
      const firstImage = data?.data?.[0];
      const remoteUrl = firstImage?.url || '';
      const base64 = firstImage?.b64_json || '';
      if (!remoteUrl && !base64) throw new Error('接口未返回 url 或 b64_json 图片数据');
      return { remoteUrl, dataUrl: base64 ? `data:image/png;base64,${base64}` : '' };
    };

    const isResponsesApiEndpoint = (apiUrl = '') => /\/responses(?:[/?#]|$)/i.test(String(apiUrl).trim());

    const resolveApiEndpoint = (apiUrl = '', kind = 'text') => {
      const rawUrl = String(apiUrl || '').trim();
      if (!rawUrl) return '';
      try {
        const url = new URL(rawUrl);
        const pathname = url.pathname.replace(/\/+$/, '');
        const isCompleteTextEndpoint = /\/(?:chat\/completions|responses)$/i.test(pathname);
        const isCompleteImageEndpoint = /\/images\/generations$/i.test(pathname);
        if ((kind === 'text' && isCompleteTextEndpoint) || (kind === 'image' && isCompleteImageEndpoint)) return rawUrl;
        if (/\/v\d+(?:\.\d+)?$/i.test(pathname)) {
          url.pathname = `${pathname}${kind === 'image' ? '/images/generations' : '/chat/completions'}`;
          return url.toString();
        }
      } catch {
        return rawUrl;
      }
      return rawUrl;
    };

    const getRequestTransport = (endpoint, kind, pageLocation = window.location) => {
      const isLocalService = pageLocation?.protocol === 'http:' && ['127.0.0.1', 'localhost'].includes(pageLocation?.hostname);
      try {
        const endpointUrl = new URL(endpoint, pageLocation.origin);
        const isLoopbackEndpoint = ['127.0.0.1', 'localhost'].includes(endpointUrl.hostname);
        if (!isLocalService && isLoopbackEndpoint) return { url: endpoint, headers: {}, blockedLocalService: true };
      } catch {}
      if (!isLocalService) return { url: endpoint, headers: {} };
      try {
        const target = new URL(endpoint, pageLocation.origin);
        if (target.origin === pageLocation.origin) return { url: endpoint, headers: {} };
        return {
          url: `/proxy/${kind === 'image' ? 'image' : 'text'}`,
          headers: { 'X-MoreImg-Upstream': target.toString() }
        };
      } catch {
        return { url: endpoint, headers: {} };
      }
    };

    // 图片 CDN 通常不带 CORS 头，浏览器直连会在“已计费”之后失败。
    // 本地服务模式下改走同源代理下载；纯静态部署时只能直连，失败即回退到人工另存。
    const getImageDownloadTransport = (imageUrl, pageLocation = window.location) => {
      const isLocalService = pageLocation?.protocol === 'http:' && ['127.0.0.1', 'localhost'].includes(pageLocation?.hostname);
      if (!isLocalService) return { url: imageUrl, headers: {} };
      try {
        const target = new URL(imageUrl, pageLocation.origin);
        if (target.origin === pageLocation.origin) return { url: imageUrl, headers: {} };
        if (!/^https?:$/.test(target.protocol)) return { url: imageUrl, headers: {} };
        return { url: '/proxy/image-asset', headers: { 'X-MoreImg-Upstream': target.toString() } };
      } catch {
        return { url: imageUrl, headers: {} };
      }
    };

    const deriveModelsEndpoint = (apiUrl = '') => {
      const normalizedUrl = String(apiUrl || '').trim();
      if (!normalizedUrl) return '';
      const url = new URL(normalizedUrl);
      const suffixes = ['/chat/completions', '/images/generations', '/responses'];
      const matchingSuffix = suffixes.find(suffix => url.pathname.replace(/\/$/, '').endsWith(suffix));
      if (matchingSuffix) {
        url.pathname = `${url.pathname.replace(/\/$/, '').slice(0, -matchingSuffix.length)}/models`;
      } else {
        url.pathname = `${url.pathname.replace(/\/$/, '')}/models`;
      }
      url.search = '';
      url.hash = '';
      return url.toString().replace(/\/$/, '');
    };

    const extractModelIds = (data = {}) => {
      const rawModels = Array.isArray(data.data) ? data.data : Array.isArray(data.models) ? data.models : [];
      return [...new Set(rawModels
        .map(item => typeof item === 'string' ? item : item?.id || item?.name || '')
        .map(item => String(item).trim())
        .filter(Boolean))];
    };

    const buildProcessingRequestBody = (apiUrl, model, messages, maxOutputTokens = PROCESSING_MAX_OUTPUT_TOKENS, stream = true) => {
      if (isResponsesApiEndpoint(apiUrl)) {
        const instructions = messages
          .filter(message => message.role === 'system')
          .map(message => String(message.content || '').trim())
          .filter(Boolean)
          .join('\n\n');
        const input = messages
          .filter(message => message.role !== 'system')
          .map(message => ({ role: message.role, content: String(message.content || '') }));
        return {
          model,
          ...(instructions ? { instructions } : {}),
          input,
          stream,
          max_output_tokens: maxOutputTokens
        };
      }

      const requestBody = { model, messages, stream, temperature: 0.7 };
      const usesCompletionTokenLimit = /^(?:gpt-5|o\d)/i.test(String(model || '').trim());
      if (usesCompletionTokenLimit) requestBody.max_completion_tokens = maxOutputTokens;
      else requestBody.max_tokens = maxOutputTokens;
      return requestBody;
    };

    const extractProcessingResponseText = (data = {}) => {
      if (typeof data.output_text === 'string') return data.output_text;
      if (typeof data.response?.output_text === 'string') return data.response.output_text;

      const choiceContent = data.choices?.[0]?.message?.content ?? data.choices?.[0]?.delta?.content;
      if (typeof choiceContent === 'string') return choiceContent;
      if (Array.isArray(choiceContent)) {
        return choiceContent.map(item => item?.text?.value || item?.text || '').join('');
      }

      const output = data.output || data.response?.output || [];
      return output.flatMap(item => item?.content || [])
        .map(content => content?.text?.value || content?.text || '')
        .filter(Boolean)
        .join('');
    };

    const extractProcessingFinishReason = (data = {}) => {
      const chatReason = data.choices?.[0]?.finish_reason;
      if (chatReason) return chatReason;
      const responseData = data.response || data;
      if (responseData.incomplete_details?.reason) return responseData.incomplete_details.reason;
      if (responseData.status === 'incomplete') return 'max_output_tokens';
      return '';
    };

    const extractProcessingStreamDelta = (data = {}) => {
      const chatDelta = data.choices?.[0]?.delta?.content;
      if (typeof chatDelta === 'string') return chatDelta;
      if (data.type === 'response.output_text.delta' && typeof data.delta === 'string') return data.delta;
      return '';
    };

    const readProcessingResponse = async (response) => {
      const contentType = String(response.headers?.get?.('content-type') || '').toLowerCase();
      if (!contentType.includes('text/event-stream')) {
        const responseText = await response.text();
        try {
          const data = JSON.parse(responseText);
          return {
            text: extractProcessingResponseText(data),
            finishReason: extractProcessingFinishReason(data)
          };
        } catch {
          return { text: responseText, finishReason: '' };
        }
      }

      if (!response.body || typeof response.body.getReader !== 'function') {
        throw new Error('接口返回了不可读取的流，请检查接口或更换文本模型。');
      }

      const reader = response.body.getReader();
      const decoder = new TextDecoder('utf-8');
      let streamBuffer = '';
      let fullResponseText = '';
      let finishReason = '';
      let streamCompleted = false;

      const consumeLine = (rawLine) => {
        const line = String(rawLine || '').trim();
        if (!line.startsWith('data:')) return;
        const payload = line.slice(5).trim();
        if (!payload) return;
        if (payload === '[DONE]') {
          streamCompleted = true;
          return;
        }
        try {
          const data = JSON.parse(payload);
          fullResponseText += extractProcessingStreamDelta(data);
          const eventFinishReason = extractProcessingFinishReason(data);
          finishReason = eventFinishReason || finishReason;
          if (eventFinishReason || ['response.completed', 'response.incomplete', 'response.failed'].includes(data.type)) {
            streamCompleted = true;
          }
        } catch {}
      };

      while (true) {
        const { done, value } = await reader.read();
        streamBuffer += decoder.decode(value || new Uint8Array(), { stream: !done });
        const lines = streamBuffer.split(/\r?\n/);
        streamBuffer = lines.pop() || '';
        lines.forEach(consumeLine);
        if (done) break;
      }
      consumeLine(streamBuffer);

      if (!streamCompleted) {
        throw new Error('流式响应提前结束，未收到完成标记，请稍后重试或检查上游服务。');
      }
      if (!fullResponseText.trim()) {
        throw new Error('大模型未返回任何有效内容，请检查接口配置或稍后重试。');
      }
      return { text: fullResponseText, finishReason };
    };

    const getCardVisibleText = (card) => card ? [card.title, card.subtitle, ...(card.points || []), card.summary].filter(Boolean) : [];

    const buildVisualOnlyPrompt = (visualPrompt, card) => {
      const visibleText = card ? [card.title, card.subtitle, ...(card.points || []), card.summary].filter(Boolean) : [];
      let sanitizedPrompt = String(visualPrompt || '')
        .replace(/```[^\n]*\n?/g, '')
        .replace(/```/g, '')
        .replace(/「[^」]*」|“[^”]*”|"[^"]*"/g, '')
        .replace(/(?:核心)?主体(?:必须)?占(?:整个)?画面(?:的)?45%-65%[^。；\n]*[。；]?/g, '')
        .replace(/顶部55%[^。；\n]*[。；]?/g, '')
        .trim();

      visibleText.forEach(text => {
        sanitizedPrompt = sanitizedPrompt.split(String(text)).join('');
      });

      const textLayoutInstruction = /(?:主标题|副标题|标题|要点|总结|行动号召|信息条|文字排版|文本排版|字体|字号|字重|文案|准确绘制|逐字|写上|标注|页码|署名|二维码)/;
      const sceneDescription = sanitizedPrompt
        .split(/[。！？；\n]+/)
        .map(sentence => sentence
          .split(/[，,]+/)
          .map(part => part.trim().replace(/^[、:：\s]+|[、:：\s]+$/g, ''))
          .filter(part => part && !textLayoutInstruction.test(part))
          .join('，'))
        .filter(part => part && !textLayoutInstruction.test(part))
        .join('。');

      const safeArea = card?.type === 'cover'
        ? '顶部约38%-42%作为文字承载范围'
        : card?.type === 'back'
          ? '顶部约34%-38%作为文字承载范围'
          : '顶部约50%-52%作为文字承载范围';
      const compositionBridge = card?.type === 'back'
        ? '收束主体、路径、视线或结构走势从下方向上进入画面中部，与上方结论形成联系；'
        : card?.type === 'cover'
          ? '主场景轮廓从画面中部开始清晰出现，与标题区形成连续叙事；'
          : '主关系从画面中部开始建立，弱化后的环境结构继续延伸到文字区；';
      return `无文字主视觉。生成一张可作为整张 3:4 卡片全幅背景的连续画面，背景自然延伸到四边，空间、光影和结构保持连贯，不要内嵌图片框、海报边框或独立卡片容器。主视觉重心位于中下部并占据足够面积，${safeArea}，但这里只降低细节和对比，不能处理成大片纯色、空雾、无内容墙面或空台面；${compositionBridge}避免上下割裂或中间出现无意义空白。底部只展示主视觉，不预留文字位置。只保留并生成以下场景或插图元素：${sceneDescription || '围绕卡片主关系设计一个主体明确、构图简洁的视觉场景'}。不得出现任何文字、字母、数字、符号、Logo、水印、卡片框架、UI、信息条或伪文字纹理；不要绘制标题、要点、总结和按钮标签。`;
    };

    const buildFullImagePrompt = (visualPrompt, card) => {
      const visibleText = getCardVisibleText(card);
      const sanitizedVisualPrompt = String(visualPrompt || '')
        .replace(/无文字主视觉|无文字视觉素材/g, '完整卡片视觉')
        .replace(/画面中不生成任何文字[^。；\n]*[。；]?/g, '')
        .replace(/不得出现任何文字[^。；\n]*[。；]?/g, '')
        .replace(/不要绘制标题[^。；\n]*[。；]?/g, '')
        .replace(/(?:核心)?主体(?:必须)?占(?:整个)?画面(?:的)?45%-65%[^。；\n]*[。；]?/g, '')
        .replace(/避免：([^。；\n]*)/g, (_, items) => {
          const keptItems = items.split(/[、，,]/)
            .map(item => item.trim())
            .filter(item => item && !/(文字|字母|数字|符号|Logo|水印|标签|代码字符|伪文字)/i.test(item));
          return keptItems.length > 0 ? `避免：${keptItems.join('、')}` : '';
        })
        .replace(/[。；]{2,}/g, '。')
        .trim();
      const layoutInstruction = card?.type === 'back'
        ? '这是封底：页标、核心总结和行动号召依次排列在上半部；下半部只展示主视觉，不放任何文字。画面必须同时出现核心总结和行动号召。'
        : card?.type === 'cover'
          ? '这是封面：主标题最醒目，副标题紧随其后，文字位于顶部低细节区域。'
          : '这是正文页：标题、要点和总结依次排列在上半部；下半部只展示主视觉，不放任何文字。';
      return `生成一张完整的小红书知识卡片成品图，直接完成3:4排版。本页必须包含且只能包含以下文字：${visibleText.map(text => `「${text}」`).join('、')}。${layoutInstruction}所有文字必须清晰可读、逐字保持不变，不能省略；禁止生成无文字版本，不要添加任何未提供的文字。\n\n视觉背景参考：${sanitizedVisualPrompt}。AI 整图为实验性输出，优先保证文字与卡片结构对应。`;
    };

    const cleanCardValue = (value = '') => value
      .replace(/^\s*[-*•]\s*/, '')
      .replace(/^\*\*|\*\*$/g, '')
      .replace(/^[「“\"]|[」”\"]$/g, '')
      .trim();

    const readCardField = (block, fieldNames) => {
      const names = (Array.isArray(fieldNames) ? fieldNames : [fieldNames])
        .map(name => name.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'))
        .join('|');
      const match = block.match(new RegExp(`(?:^|\\n)\\s*(?:[-*•]\\s*)?(?:\\*\\*)?(?:${names})(?:\\*\\*)?\\s*[：:]\\s*(.+)`, 'm'));
      return cleanCardValue(match?.[1] || '');
    };

    const readCardPoints = (block) => {
      const lines = block.split('\n');
      const points = [];
      let collecting = false;
      for (const rawLine of lines) {
        const line = rawLine.trim();
        if (/^(?:[-*•]\s*)?(?:\*\*)?(?:内容要点|要点)(?:\*\*)?\s*[：:]/.test(line)) {
          collecting = true;
          const inlineValue = line.replace(/^(?:[-*•]\s*)?(?:\*\*)?(?:内容要点|要点)(?:\*\*)?\s*[：:]\s*/, '');
          if (inlineValue) points.push(...inlineValue.split(/[；;]/).map(cleanCardValue).filter(Boolean));
          continue;
        }
        if (collecting && /^(?:[-*•]\s*)?(?:\*\*)?(?:一句话总结|总结|核心总结|行动号召|核心比喻)(?:\*\*)?\s*[：:]/.test(line)) break;
        if (collecting && /^[-*•]\s+/.test(line)) points.push(cleanCardValue(line));
      }
      return points;
    };

    const parseCardPackage = (content) => {
      if (!content) return [];
      const headerRegex = /(?:^|\n)\s*(?:#{1,6}\s*)?(?:\*\*)?(封面卡片|正文卡片\s*\d+\/\d+|封底卡片)(?:\*\*)?\s*[：:]?\s*(?=\n|$)/g;
      const headers = [...content.matchAll(headerRegex)];
      return headers.map((header, index) => {
        const label = header[1].replace(/\s+/g, ' ').trim();
        const blockStart = header.index + header[0].length;
        const blockEnd = headers[index + 1]?.index ?? content.length;
        const block = content.slice(blockStart, blockEnd).trim();
        const isCover = label === '封面卡片';
        const isBack = label === '封底卡片';
        const bodyMatch = label.match(/正文卡片\s*(\d+\/\d+)/);
        const imageKey = isCover ? '封面' : isBack ? '封底' : `正文${bodyMatch?.[1] || index}`;
        return {
          id: `${imageKey}-${index}`,
          label: isCover ? '封面' : isBack ? '封底' : `正文 ${bodyMatch?.[1] || ''}`,
          imageKey,
          type: isCover ? 'cover' : isBack ? 'back' : 'body',
          title: isCover ? readCardField(block, '主标题') : isBack ? readCardField(block, '核心总结') : readCardField(block, '标题'),
          subtitle: isCover ? readCardField(block, '副标题') : '',
          points: isCover || isBack ? [] : readCardPoints(block),
          summary: isBack ? readCardField(block, '行动号召') : readCardField(block, ['一句话总结', '总结'])
        };
      }).filter(card => card.title || card.subtitle || card.points.length || card.summary);
    };

    const getPageDisplayName = (page, contentCount = 0) => {
      if (page.page_id === 'cover') return '封面';
      if (page.page_id === 'closing') return '封底';
      const match = page.page_id.match(/^content-(\d+)$/);
      return `正文${Number(match?.[1] || page.order - 1)}/${contentCount || '?'}`;
    };

    const packagePageToCard = (page, index, pages = []) => {
      const contentCount = Math.max(0, pages.length - 2);
      const type = page.page_id === 'cover' ? 'cover' : page.page_id === 'closing' ? 'back' : 'body';
      const imageKey = getPageDisplayName(page, contentCount);
      return {
        id: `${page.page_id}-${index}`,
        label: imageKey === '封面' || imageKey === '封底' ? imageKey : imageKey.replace('正文', '正文 '),
        imageKey,
        pageId: page.page_id,
        type,
        title: page.card.title,
        subtitle: page.card.subtitle || '',
        points: Array.isArray(page.card.points) ? page.card.points : [],
        summary: page.card.summary || ''
      };
    };

    const packagePageToPromptSection = (page, styleLock, pages = []) => ({
      title: getPageDisplayName(page, Math.max(0, pages.length - 2)),
      pageId: page.page_id,
      text: buildPageImagePrompt(styleLock, page)
    });

    const getPackageStageText = (packageData, stageId) => {
      if (!packageData || packageData.status !== 'complete') return '';
      if (stageId === 1) {
        const modeLabels = { standard: '标准模式', short: '短文模式', single_point: '单点模式' };
        return [
          `## 判型结论`,
          `- 加工模式：${modeLabels[packageData.analysis.mode] || packageData.analysis.mode}`,
          `- 主题：${packageData.analysis.topic}`,
          `- 核心观点：${packageData.analysis.core_claim}`,
          `- 独立信息单元：${packageData.analysis.independent_units.join('；')}`
        ].join('\n');
      }
      if (stageId === 2) {
        const factLines = packageData.analysis.fact_notes.length
          ? packageData.analysis.fact_notes.map(item => `- ${item.claim || '未命名信息'}：${item.note || item.status || '未说明'}`)
          : ['- 原文没有需要单独提示的事实边界'];
        const logicLines = packageData.analysis.logic_issues.length
          ? packageData.analysis.logic_issues.map(item => `- ${typeof item === 'string' ? item : item.note || item.issue || JSON.stringify(item)}`)
          : ['- 未发现需要单独提示的逻辑问题'];
        return [`## 事实边界`, ...factLines, `## 逻辑检查`, ...logicLines].join('\n');
      }
      if (stageId === 3) {
        return [`# ${packageData.article.title}`, packageData.article.subtitle ? `## ${packageData.article.subtitle}` : '', ...packageData.article.paragraphs].filter(Boolean).join('\n\n');
      }
      if (stageId === 4) return 'JSON 卡片页面';
      if (stageId === 5) return 'JSON 视觉页面';
      return '';
    };

    const getCardShellPresentation = (styleLock) => {
      const shell = styleLock?.card_shell || {};
      const surface = shell.surface === 'light' ? 'light' : 'dark';
      const overlay = MOREIMG_OVERLAYS.has(shell.overlay) ? shell.overlay : surface === 'light' ? 'soft_light' : 'soft_dark';
      const accentColor = /^#[0-9A-F]{6}$/i.test(shell.accent_color || '') ? shell.accent_color : '#F59E42';
      return {
        className: `moreimg-card-surface-${surface} moreimg-card-overlay-${overlay}`,
        style: { '--moreimg-card-accent': accentColor }
      };
    };

    const HTML_CARD_EXPORT_STYLES = `
      .moreimg-export-card{--moreimg-card-accent:#F59E42;box-sizing:border-box;position:relative;isolation:isolate;width:1242px;height:1656px;overflow:hidden;background:#121417;color:#f7f7f2;font-family:"Noto Sans SC Variable",sans-serif;padding:0;letter-spacing:0}
      .moreimg-export-card *{box-sizing:border-box}
      /* 背景层用正 z-index 叠放：html2canvas 会丢弃负 z-index 的绝对定位子层，导出成品会缺遮罩与噪点。 */
      .moreimg-card-media{position:absolute;inset:0;z-index:0;background:#15171a;overflow:hidden}
      .moreimg-card-media img{width:100%;height:100%;object-fit:cover;object-position:center var(--moreimg-card-focus-y,58%);display:block;transform:scale(1.012)}
      .moreimg-card-visual-placeholder{position:absolute;inset:0;background:radial-gradient(circle at 62% 66%,rgba(239,232,216,.25),transparent 24%),linear-gradient(155deg,#313842 0%,#15181d 56%,#08090b 100%)}
      .moreimg-card-shade{position:absolute;inset:0;z-index:1;pointer-events:none;background:linear-gradient(180deg,rgba(7,9,12,.9) 0%,rgba(7,9,12,.66) 24%,rgba(7,9,12,.08) 58%,rgba(7,9,12,.44) 100%)}
      .moreimg-card-body .moreimg-card-shade{background:linear-gradient(180deg,rgba(5,8,12,.9) 0%,rgba(5,8,12,.72) 28%,rgba(5,8,12,.38) 48%,rgba(5,8,12,.08) 66%,rgba(5,8,12,.04) 100%)}
      .moreimg-card-back .moreimg-card-shade{background:linear-gradient(180deg,rgba(7,9,12,.9) 0%,rgba(7,9,12,.68) 30%,rgba(7,9,12,.28) 50%,rgba(7,9,12,.06) 68%,rgba(7,9,12,.03) 100%)}
      .moreimg-card-noise{position:absolute;inset:0;z-index:2;opacity:.1;background-image:radial-gradient(rgba(255,255,255,.38) .7px,transparent .8px);background-size:8px 8px;mix-blend-mode:soft-light;pointer-events:none}
      .moreimg-card-content{position:relative;z-index:3;width:1080px;height:1440px;padding:78px;display:flex;flex-direction:column;transform:scale(1.15,1.152778);transform-origin:top left}
      .moreimg-card-header{max-width:890px}
      .moreimg-card-kicker{display:flex;align-items:center;gap:14px;color:rgba(255,255,255,.76);font-size:29px;line-height:1;font-weight:780;letter-spacing:.06em}
      .moreimg-card-kicker-mark{display:block;width:6px;height:28px;border-radius:3px;background:var(--moreimg-card-accent);flex:none}
      /* html2canvas 的中文字形基线比 Chrome 布局低，仅在导出克隆中做视觉对齐。 */
      .moreimg-export-render .moreimg-card-kicker-mark{transform:translateY(14px)}
      .moreimg-card-title{margin:44px 0 0;font-size:92px;line-height:1.08;font-weight:920;letter-spacing:0;color:#f8f7f2;max-width:930px;overflow-wrap:anywhere;text-wrap:balance;text-shadow:0 2px 12px rgba(0,0,0,.3)}

    const getCardTextDensity = (card) => {
      const titleLength = [...String(card?.title || '')].length;
      const subtitleLength = [...String(card?.subtitle || '')].length;
      const points = Array.isArray(card?.points) ? card.points : [];
      const pointLength = points.reduce((total, point) => total + [...String(point || '')].length, 0);
      const summaryLength = [...String(card?.summary || '')].length;
      const longestPoint = points.reduce((longest, point) => Math.max(longest, [...String(point || '')].length), 0);
      const score = titleLength * 2 + subtitleLength + pointLength + summaryLength + points.length * 8;

      if (card?.type === 'body' && (score > 126 || titleLength > 18 || points.length >= 5 && longestPoint > 21)) return 'extra-dense';
      if (card?.type === 'body' && (score > 92 || titleLength > 14 || points.length >= 5 || longestPoint > 24)) return 'dense';
      if (card?.type === 'cover' && titleLength + subtitleLength + summaryLength > 54) return 'dense';
      if (card?.type === 'back' && titleLength + summaryLength > 34) return 'dense';
      return 'standard';
    };

    const getDefaultCardFocus = (card) => card?.type === 'back' ? 42 : card?.type === 'body' ? 54 : 58;

    const handleTabListKeyDown = (event) => {
      if (!['ArrowLeft', 'ArrowRight', 'Home', 'End'].includes(event.key)) return;
      const tabList = event.currentTarget.closest('[role="tablist"]');
      if (!tabList) return;
      const tabs = [...tabList.querySelectorAll('[role="tab"]')].filter(tab => !tab.disabled);
      const currentIndex = tabs.indexOf(event.currentTarget);
      if (currentIndex < 0 || tabs.length < 2) return;

      event.preventDefault();
      const nextIndex = event.key === 'Home'
        ? 0
        : event.key === 'End'
          ? tabs.length - 1
          : event.key === 'ArrowRight'

const DIALOG_FOCUSABLE_SELECTOR = [
  'button:not([disabled])',
  '[href]',
  'input:not([disabled])',
  'select:not([disabled])',
  'textarea:not([disabled])',
  '[tabindex]:not([tabindex="-1"])'
].join(',');

const ModalFrame = ({
  isOpen,
  onRequestClose,
  titleId,
  overlayClassName,
  dialogClassName,
  closeOnBackdrop = true,
  initialFocusSelector = '[data-dialog-initial-focus="true"]',
  children
}) => {
  const dialogRef = useRef(null);
  const returnFocusRef = useRef(null);
  const closeHandlerRef = useRef(onRequestClose);

  useEffect(() => {
    closeHandlerRef.current = onRequestClose;
  }, [onRequestClose]);

  useEffect(() => {
    if (!isOpen) return undefined;
    returnFocusRef.current = document.activeElement instanceof HTMLElement ? document.activeElement : null;

    const getFocusable = () => [...(dialogRef.current?.querySelectorAll(DIALOG_FOCUSABLE_SELECTOR) || [])]
      .filter(element => !element.hidden && element.getAttribute('aria-hidden') !== 'true' && element.getClientRects().length > 0);
    const focusInitialControl = () => {
      const preferredControl = dialogRef.current?.querySelector(initialFocusSelector);
      const target = preferredControl || getFocusable()[0] || dialogRef.current;
      target?.focus({ preventScroll: true });
    };
    const animationFrame = requestAnimationFrame(focusInitialControl);

    const handleDocumentKeyDown = event => {
      if (event.key === 'Escape') {
        event.preventDefault();
        closeHandlerRef.current();
        return;
      }
      if (event.key !== 'Tab') return;
      const focusable = getFocusable();
      if (!focusable.length) {
        event.preventDefault();
        dialogRef.current?.focus({ preventScroll: true });
        return;
      }
      const first = focusable[0];
      const last = focusable.at(-1);
      if (event.shiftKey && document.activeElement === first) {
        event.preventDefault();
        last.focus();
      } else if (!event.shiftKey && document.activeElement === last) {
        event.preventDefault();
        first.focus();
      } else if (!dialogRef.current?.contains(document.activeElement)) {
        event.preventDefault();
        first.focus();
      }
    };

    document.addEventListener('keydown', handleDocumentKeyDown);
    return () => {
      cancelAnimationFrame(animationFrame);
      document.removeEventListener('keydown', handleDocumentKeyDown);
      const returnTarget = returnFocusRef.current;
      requestAnimationFrame(() => {
        if (returnTarget?.isConnected) returnTarget.focus({ preventScroll: true });
      });
    };
  }, [isOpen, initialFocusSelector]);

  if (!isOpen) return null;

  return (
    <div
      className={overlayClassName}
      onMouseDown={event => {
        if (closeOnBackdrop && event.target === event.currentTarget) onRequestClose();
      }}
    >
      <div
        ref={dialogRef}
        className={dialogClassName}
        role="dialog"
        aria-modal="true"
        aria-labelledby={titleId}
        tabIndex={-1}
      >
        {children}
      </div>
    </div>
  );
};

    const DEFAULT_PROMPT_VERSION = 9;

    const normalizeSystemPrompt = (prompt = '') => String(prompt).replace(/\s+/g, ' ').trim();

    const isLegacyDefaultPrompt = (prompt, currentDefaultPrompt = DEFAULT_SYSTEM_PROMPT) => {
      const normalized = normalizeSystemPrompt(prompt);
      if (!normalized || normalized === normalizeSystemPrompt(currentDefaultPrompt)) return false;
      const hasDefaultStructure = normalized.includes('阶段1：原料接收与判型')
        && normalized.includes('阶段6：交付后质量自检')
        && normalized.includes('激活指令：');
      const knownDefaultFamily = normalized.includes('核心工作流')
        || (normalized.includes('交付总原则')
          && normalized.includes('每张卡只输出一次提示词')
          && normalized.includes('不要再输出总览副本'));
      const previousDefaultMarkers = [
        '篇幅是否足以支撑' + '至少3张正文卡片',
        '阶段3必须输出可独立发布的' + '完整文章',
        '核心比喻（用' + '“A = B”概括）',
        '核心主体必须占整个画面' + '的45%-65%'
      ];
      return hasDefaultStructure && knownDefaultFamily && previousDefaultMarkers.some(marker => normalized.includes(marker))
        || hasDefaultStructure && knownDefaultFamily;
    };

    const shouldOfferDefaultPromptUpgrade = (config = {}) => (
      Number(config.promptVersion || 0) < DEFAULT_PROMPT_VERSION
      && isLegacyDefaultPrompt(config.systemPrompt)
    );

    const hasSavedApiConfig = () => {
      try {
        const savedConfig = localStorage.getItem('agent_api_config');
        if (!savedConfig) return false;
        const parsedConfig = JSON.parse(savedConfig);
        return Boolean(parsedConfig.apiKey?.trim());
      } catch {
        return false;
      }
    };

    let html2CanvasLoader = null;
    let exportFontStylesheetLoader = null;

    const loadExportFontStylesheet = () => {
      if (exportFontStylesheetLoader) return exportFontStylesheetLoader;

      exportFontStylesheetLoader = new Promise((resolve, reject) => {
        const link = document.createElement('link');
        link.rel = 'stylesheet';
        link.href = 'fonts/noto-sans-sc.css';
        link.dataset.moreimgExportFonts = 'true';
        link.onload = () => resolve(link);
        link.onerror = () => reject(new Error('导出字体样式加载失败'));
        document.head.appendChild(link);
      }).catch(error => {
        document.querySelector('link[data-moreimg-export-fonts="true"]')?.remove();
        exportFontStylesheetLoader = null;
        throw error;
      });
      return exportFontStylesheetLoader;
    };

    const loadHtml2Canvas = () => {
      if (window.html2canvas) return Promise.resolve(window.html2canvas);
      if (html2CanvasLoader) return html2CanvasLoader;

      html2CanvasLoader = new Promise((resolve, reject) => {
        const script = document.createElement('script');
        script.src = 'vendor/html2canvas.js';
        script.onload = () => window.html2canvas
          ? resolve(window.html2canvas)
          : reject(new Error('导出组件加载失败'));
        script.onerror = () => reject(new Error('导出组件加载失败'));
        document.head.appendChild(script);
      }).catch(error => {
        html2CanvasLoader = null;
        throw error;
      });
      return html2CanvasLoader;
    };

    function App() {
